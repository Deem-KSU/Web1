
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add a New Service</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <img src="logo.png" alt="PureRide Logo">
    </div>

    <nav>
      <ul class="nav">
        <li><a href="#">Our Services</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Service Provider Dashboard</a></li>
        <li><a href="#">Customer Dashboard</a></li>
      </ul>
    </nav>
  </header>

  <h2>Add a New Service</h2>

  <!-- IMPORTANT: الفورم مربوطه بدالة JS -->
 <form class="provider-form"
      id="addServiceForm"
      action="#"
      method="post"
      novalidate
      onsubmit="handleAddService(event)">

    <label>
      <span>Service Name</span>
      <input type="text"
             id="serviceName"
             name="service_name"
             required
             inputmode="text"
             placeholder="Add text">
    </label>

    <!-- Price (numbers only) -->
    <label><span>Price</span></label>
    <input type="number"
           id="servicePrice"
           name="service_price"
           class="price-input"
           placeholder="Enter price"
           min="0"
           required>

    <!-- Description -->
    <label>
      <span>Service Description</span>
      <textarea id="serviceDescription"
                name="service_description"
                rows="5"
                required
                minlength="10"
                maxlength="300"
                placeholder="Add text"></textarea>
    </label>

    <!-- Photo (image only) -->
    <label><span>Photo</span></label>
    <div class="dropzone">
      <input id="servicePhoto"
             type="file"
             name="service_photo"
             accept="image/*"
             required
             hidden>
      <label for="servicePhoto" class="upload-content">
        <img src="browseFile.png" alt="Upload icon">
        <span class="upload-btn">Browse Files</span>
      </label>
    </div>

    <!-- Submit -->
    <button type="submit">Submit</button>
  </form>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <div class="logo">
        <img src="logo.png" alt="PureRide Logo">
      </div>
      <p>Copyright &copy; 2025 PureRide</p>
    </div>

    <div class="contact-info">
      Contact us:
      <div>OurEmail@email.com</div>
      <div>+3665050505050</div>
    </div>

    <div class="social-media">
      <p>Follow us on Social:</p>
      <div>
        <a href="#">Instagram</a>
        <a href="#">Facebook</a>
        <a href="#">WhatsApp</a>
        <a href="#">Twitter</a>
      </div>
    </div>
  </footer>

  <!-- ربط ملف الجافاسكربت الخارجي -->
  <script src="add_service.js"></script>
</body>
</html>
